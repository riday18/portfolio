<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>riday.space</title>
<meta name="description" content="Riday Raheja is a 3D artist working across product visualization, motion graphics, interior and event visualization.">
<meta property="og:title" content="riday.space">
<meta property="og:description" content="3D artist: product visualization, motion graphics, interior and event visualization.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#collage">Skip to projects</a>

<header class="nav" id="nav">
  <nav class="nav-links" aria-label="Main">
    <a href="#work" data-section="work">work</a>
    <a href="#about" data-section="about">about</a>
    <a href="#contact" data-section="contact">contact</a>
  </nav>
  <a class="nav-logo" href="#work" id="nav-logo">riday.space</a>
  <div class="nav-social" id="nav-social"></div>
</header>

<main>
  <section class="stage" id="work" aria-label="Work">
    <div class="intro" id="intro">
      <div class="intro-photo" id="intro-photo"></div>
      <p class="intro-text" id="intro-text"></p>
    </div>

    <div class="stage-pin" id="stage-pin">
    <div class="scene" id="scene">
      <div class="scene-art" id="scene-art" aria-hidden="true"></div>
      <div class="scene-screen" id="scene-screen" aria-hidden="true"></div>
      <div class="scene-px" id="scene-px">
        <div class="screen-main" id="screen-main" aria-hidden="true">
          <div class="screen-photo" id="screen-photo"></div>
          <p class="screen-text" id="screen-text"></p>
        </div>
        <nav class="screen-nav" id="screen-nav" aria-label="Sections">
          <a href="#work" data-section="work">work</a>
          <a href="#about" data-section="about">about</a>
          <a href="#contact" data-section="contact">contact</a>
        </nav>
      </div>
    </div>

    <ul class="collage" id="collage" aria-label="Projects"></ul>
    </div>
  </section>

</main>


<dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-inner" id="viewer-inner"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
